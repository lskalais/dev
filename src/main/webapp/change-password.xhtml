<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:pt="jakarta.faces.passthrough"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title>Changer le mot de passe | Africa Legacy Market</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet library="css" name="app.css"/>
    <h:outputStylesheet library="css" name="theme.css"/>
    <h:outputScript library="js" name="theme.js" target="head"/>
</h:head>
<h:body>
<header class="topbar">
    <h:link outcome="home" styleClass="brand" value="Africa Legacy Market"/>
    <div class="topbar-user">
        <span>#{marketplace.user.name()} <small>#{marketplace.roleLabel}</small></span>
        <button class="button outline small theme-toggle" type="button" data-theme-toggle="true"
                aria-pressed="false">Mode sombre</button>
        <h:form>
            <h:commandButton value="Déconnexion" action="#{marketplace.logout}"
                             styleClass="button outline small"/>
        </h:form>
    </div>
</header>
<main class="container narrow">
    <section class="panel auth-card">
        <span class="eyebrow">Action requise</span>
        <h1>Choisissez votre nouveau mot de passe</h1>
        <p>Le mot de passe temporaire ne peut pas être réutilisé pour accéder aux autres fonctions.</p>
        <h:messages globalOnly="true" styleClass="flash-list" infoClass="flash success"
                    errorClass="flash error" warnClass="flash warning"/>
        <h:form styleClass="form-grid">
            <h:outputLabel for="newPassword" value="Nouveau mot de passe"/>
            <h:inputSecret id="newPassword" value="#{marketplace.newPassword}" required="true"
                           pt:autocomplete="new-password"/>
            <h:outputLabel for="confirmedNewPassword" value="Confirmer le nouveau mot de passe"/>
            <h:inputSecret id="confirmedNewPassword" value="#{marketplace.confirmedNewPassword}"
                           required="true" pt:autocomplete="new-password"/>
            <h:commandButton value="Enregistrer le nouveau mot de passe"
                             action="#{marketplace.changeTemporaryPassword}"
                             styleClass="button primary"/>
        </h:form>
    </section>
</main>
<ui:include src="/WEB-INF/includes/footer.xhtml"/>
</h:body>
</html>
